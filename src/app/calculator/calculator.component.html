<div class="calculator-container">
  <div class="operation-area">
      <div class="input-area">
      <textarea #expressionInput class="expression-input" [(ngModel)]="inputText" (ngModelChange)="onInputChange()"
        (keydown)="onKeyDown($event)" placeholder="Type here..">
      </textarea>
      </div>

      <div class="results-area" *ngIf="results.length >= 0">
      <div *ngFor="let result of results" class="calculation-result" [class.error]="result.isError"
        [class.empty-space]="result.isEmptySpace">
        <div class="result">{{ result.result }}</div>
      </div>
      </div>
  </div>

  <div class="notion-panel">
    <div class="notion-header">
      <div class="notion-title">Today — Open Tasks</div>
      <button class="btn btn-secondary btn-small" (click)="refreshNotionTasks()" [disabled]="notionLoading || !notionAvailable || !notionConfigured">
        Refresh
      </button>
    </div>

    <div class="notion-body" *ngIf="notionAvailable; else notionUnavailable">
      <div class="notion-setup" *ngIf="!notionConfigured">
        <div class="notion-state">Enter your Notion API key once to enable tasks.</div>
        <div class="notion-inputs">
          <input class="notion-input" type="password" placeholder="Notion API key" [(ngModel)]="notionApiKeyInput" />
          <input class="notion-input" type="text" placeholder="Tasks DB ID (optional)" [(ngModel)]="notionDbIdInput" />
          <button class="btn btn-small" (click)="saveNotionConfig()" [disabled]="notionLoading">Save</button>
        </div>
      </div>

      <div class="notion-state" *ngIf="notionLoading">Loading...</div>
      <div class="notion-state error" *ngIf="notionError">{{ notionError }}</div>

      <div class="notion-empty" *ngIf="!notionLoading && !notionError && notionTasks.length === 0">
        No open tasks due today.
      </div>

      <ul class="notion-list" *ngIf="!notionLoading && !notionError && notionTasks.length > 0">
        <li *ngFor="let task of notionTasks" class="notion-item">
          <div class="task-title">{{ task.title }}</div>
          <div class="task-meta">
            <span class="task-project" *ngIf="task.project">{{ task.project }}</span>
            <span class="task-due" *ngIf="task.due">{{ task.due }}</span>
          </div>
        </li>
      </ul>
    </div>

    <ng-template #notionUnavailable>
      <div class="notion-state error">Notion integration unavailable. Run the app with `NOTION_API_KEY` set.</div>
    </ng-template>
  </div>
</div>
