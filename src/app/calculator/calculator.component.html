<div class="calculator-container">
  <div class="operation-area">
      <div class="input-area">
      <textarea #expressionInput class="expression-input" [(ngModel)]="inputText" (ngModelChange)="onInputChange()"
        (keydown)="onKeyDown($event)" placeholder="Type your mathematical expressions here..">
      </textarea>
      </div>

      <div class="results-area" *ngIf="results.length >= 0">
      <div *ngFor="let result of results" class="calculation-result" [class.error]="result.isError"
        [class.empty-space]="result.isEmptySpace">
        <div class="result">{{ result.result }}</div>
      </div>
      </div>
  </div>

  <div class="toolbar">
    <div class="help-text">
      <strong>Supported functions:</strong>
      <span class="example">+</span>
      <span class="example">-</span>
      <span class="example">*</span>
      <span class="example">/</span>
      <span class="example">^</span>
      <span class="example">sqrt()</span>
      <span class="example">sin()</span>
      <span class="example">cos()</span>
      <span class="example">tan()</span>
      <span class="example">log()</span>
      <span class="example">ln()</span>
      <span class="example">abs()</span>
      <span class="example">pi</span>
      <span class="example">e</span>
    </div>

    <div>
      <button class="btn btn-secondary" (click)="copyResults()" *ngIf="results.length > 0">
        Copy Results
      </button>
      <button class="btn btn-danger" (click)="clearAll()">
        Clear All
      </button>
    </div>
  </div>
</div>
